<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8" />
<title>Watch-Streak-Alert</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: transparent;
    overflow: hidden;
  }

  body {
    --accent: #ff7a1a;
    font-family: "Segoe UI", "Inter", system-ui, sans-serif;
    color: #fff;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 24px;
    box-sizing: border-box;
  }

  body.h-left { justify-content: flex-start; }
  body.h-right { justify-content: flex-end; }
  body.v-middle { align-items: center; }
  body.v-bottom { align-items: flex-end; }

  .alert {
    position: relative;
    display: grid;
    grid-template-columns: auto minmax(0, 1fr);
    align-items: center;
    gap: 18px;
    width: min(720px, 100%);
    padding: 18px 26px 22px 18px;
    border-radius: 18px;
    background: linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.45)),
    url('/overlay-assets/alert-bg.png') center/cover no-repeat;
    border: 2px solid var(--accent);
    box-shadow: 0 0 0 6px color-mix(in srgb, var(--accent) 25%, transparent), 0 18px 40px rgba(0, 0, 0, 0.5);
    overflow: hidden;
    opacity: 0;
    transform: translateY(-40px) scale(0.92);
  }

  .alert[hidden] {
    display: none;
  }

  .alert.show {
    animation: enter 0.6s cubic-bezier(0.2, 1.4, 0.4, 1) forwards;
  }

  .alert.hide {
    animation: leave 0.45s ease-in forwards;
  }

  @keyframes enter {
    to { opacity: 1; transform: none; }
  }

  @keyframes leave {
    from { opacity: 1; transform: none; }
    to { opacity: 0; transform: translateY(-30px) scale(0.95); }
  }

  .badge {
    position: relative;
    width: 84px;
    height: 84px;
  }

  .avatar {
    width: 84px;
    height: 84px;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid var(--accent);
    background: var(--accent);
    display: grid;
    place-items: center;
    font-size: 36px;
    font-weight: 800;
  }

  .custom {
    width: 120px;
    height: 120px;
    object-fit: contain;
    display: block;
    filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.5));
  }

  .badge.has-custom {
    width: 120px;
    height: 120px;
  }

  .badge.has-custom .flame {
    display: none;
  }

  .flame {
    position: absolute;
    right: -10px;
    bottom: -8px;
    font-size: 34px;
    filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.6));
    animation: flicker 1.2s ease-in-out infinite;
  }

  @keyframes flicker {
    50% { transform: scale(1.15) rotate(-6deg); }
  }

  .kicker {
    font-size: 14px;
    font-weight: 800;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--accent);
  }

  .text {
    margin-top: 2px;
    font-size: 26px;
    font-weight: 700;
    line-height: 1.25;
    text-shadow: 0 2px 6px rgba(0, 0, 0, 0.6);
  }

  .text .name {
    color: var(--accent);
  }

  .text .streak {
    display: inline-block;
    padding: 0 8px;
    border-radius: 8px;
    background: var(--accent);
    color: #fff;
  }

  .message {
    margin-top: 8px;
    font-size: 17px;
    color: rgba(255, 255, 255, 0.82);
    font-style: italic;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }

  .message:empty {
    display: none;
  }

  .timer {
    position: absolute;
    left: 0;
    bottom: 0;
    height: 4px;
    width: 100%;
    background: var(--accent);
    transform-origin: left;
  }
</style>
</head>
<body>
<div class="alert" id="alert" hidden>
  <div class="badge" id="badge">
    <div id="avatar-slot"></div>
    <div class="flame" aria-hidden="true">🔥</div>
  </div>
  <div>
    <div class="kicker">Watch-Streak</div>
    <div class="text" id="text"></div>
    <div class="message" id="message"></div>
  </div>
  <div class="timer" id="timer"></div>
</div>

<script>
  (function applyAlign() {
    const align = new URLSearchParams(location.search).get("align") || "top-left";
    const [v, h] = align === "center" ? ["middle", "center"] : align.split("-");
    document.body.classList.add("v-" + v, "h-" + h);
  })();

  const alertEl = document.getElementById("alert");
  const textEl = document.getElementById("text");
  const messageEl = document.getElementById("message");
  const avatarSlot = document.getElementById("avatar-slot");
  const badgeEl = document.getElementById("badge");
  const timerEl = document.getElementById("timer");
  const token = new URLSearchParams(location.search).get("token") || "";

  const queue = [];
  let playing = false;
  let audio = null;

  const wait = (ms) => new Promise((r) => setTimeout(r, ms));

  function chime(volume) {
    try {
      audio = audio || new AudioContext();
      const now = audio.currentTime;
      [523.25, 659.25, 783.99, 1046.5].forEach((freq, i) => {
        const osc = audio.createOscillator();
        const gain = audio.createGain();
        osc.type = "triangle";
        osc.frequency.value = freq;
        const start = now + i * 0.09;
        gain.gain.setValueAtTime(0, start);
        gain.gain.linearRampToValueAtTime(0.35 * volume, start + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.6);
        osc.connect(gain).connect(audio.destination);
        osc.start(start);
        osc.stop(start + 0.65);
      });
    } catch (err) {
      console.error(err);
    }
  }

  function renderText(template, name, streak) {
    textEl.textContent = "";
    const parts = String(template || "{name} schaut seit {streak} Streams in Folge!").split(/(\{name\}|\{streak\})/);
    for (const part of parts) {
      if (part === "{name}" || part === "{streak}") {
        const span = document.createElement("span");
        span.className = part === "{name}" ? "name" : "streak";
        span.textContent = part === "{name}" ? name : String(streak);
        textEl.appendChild(span);
      } else if (part) {
        textEl.appendChild(document.createTextNode(part));
      }
    }
  }

  const withToken = (url) => url + (url.includes("?") ? "&" : "?") + "token=" + encodeURIComponent(token);

  function playSound(a) {
    const volume = Math.min(1, Math.max(0, Number(a.volume) || 0));
    if (!a.soundUrl) return chime(volume);
    const sound = new Audio(withToken(a.soundUrl));
    sound.volume = volume;
    sound.play().catch(() => chime(volume));
  }

  function renderBadge(a) {
    badgeEl.classList.toggle("has-custom", Boolean(a.imageUrl));
    if (!a.imageUrl) return renderAvatar(a.avatarUrl, a.name);
    avatarSlot.textContent = "";
    let media;
    if (a.imageKind === "video") {
      media = document.createElement("video");
      media.autoplay = true;
      media.muted = true;
      media.loop = true;
      media.playsInline = true;
    } else {
      media = document.createElement("img");
      media.alt = "";
    }
    media.className = "custom";
    media.src = withToken(a.imageUrl);
    avatarSlot.appendChild(media);
  }

  function renderAvatar(url, name) {
    avatarSlot.textContent = "";
    if (url) {
      const img = document.createElement("img");
      img.className = "avatar";
      img.alt = "";
      img.src = url;
      avatarSlot.appendChild(img);
    } else {
      const letter = document.createElement("div");
      letter.className = "avatar";
      letter.textContent = (name || "?").charAt(0).toUpperCase();
      avatarSlot.appendChild(letter);
    }
  }

  async function play(a) {
    document.body.style.setProperty("--accent", a.accentColor || "#ff7a1a");
    alertEl.style.backgroundImage = a.backgroundUrl ? "url('" + withToken(a.backgroundUrl) + "')" : "";
    renderBadge(a);
    renderText(a.template, a.name, a.streak);
    messageEl.textContent = a.message || "";

    const duration = Math.max(3000, Number(a.durationMs) || 8000);
    timerEl.style.transition = "none";
    timerEl.style.transform = "scaleX(1)";

    alertEl.hidden = false;
    alertEl.classList.remove("hide");
    alertEl.classList.add("show");
    if (a.sound) playSound(a);

    requestAnimationFrame(() => {
      timerEl.style.transition = "transform " + duration + "ms linear";
      timerEl.style.transform = "scaleX(0)";
    });

    await wait(duration);
    alertEl.classList.remove("show");
    alertEl.classList.add("hide");
    await wait(500);
    alertEl.hidden = true;
    await wait(600);
  }

  async function next() {
    if (playing) return;
    playing = true;
    while (queue.length > 0) await play(queue.shift());
    playing = false;
  }

  let retryMs = 2000;

  function connect() {
    const protocol = location.protocol === "https:" ? "wss:" : "ws:";
    const socket = new WebSocket(
      protocol + "//" + location.host + "/overlay/watch-streak/ws?token=" + encodeURIComponent(token)
    );
    socket.onopen = () => {
      retryMs = 2000;
    };
    socket.onmessage = (event) => {
      try {
        const data = JSON.parse(event.data);
        if (data.type === "alert") {
          queue.push(data);
          next();
        }
      } catch (err) {
        console.error(err);
      }
    };
    socket.onclose = (event) => {
      if (event.code === 4001) return;
      setTimeout(connect, retryMs);
      retryMs = Math.min(retryMs * 2, 15000);
    };
  }

  connect();
</script>
</body>
</html>
